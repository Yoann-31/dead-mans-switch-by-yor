name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # permet de lancer le build manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Compiler l'APK de debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: dead-mans-switch-by-yor-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
