name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # permet de lancer le build manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer les composants du SDK (au besoin)
        continue-on-error: true   # le SDK est déjà préinstallé ; cette étape ne fait que compléter
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Compiler l'APK de debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: dead-mans-switch-by-yor-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
