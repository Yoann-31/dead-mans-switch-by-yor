plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Charge la configuration de signature si keystore.properties existe (jamais versionné)
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.example.veille'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.veille"
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName "2.2"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    packaging {
        resources {
            excludes += [
                'META-INF/NOTICE.md', 'META-INF/LICENSE.md',
                'META-INF/NOTICE', 'META-INF/LICENSE',
                'META-INF/NOTICE.txt', 'META-INF/LICENSE.txt',
                'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST'
            ]
        }
    }

    // Nomme le fichier APK généré "YRO.apk"
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "YRO.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Chiffrement des données locales (EncryptedSharedPreferences)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // JavaMail (envoi d'e-mails par SMTP, en arrière-plan)
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
